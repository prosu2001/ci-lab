name: CI Pipeline
# 觸發時機：當有人向 main 分支發起 PR，或是直接 push 到 main
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    
jobs:
  build-and-test:
    runs-on: ubuntu-latest # 在 GitHub 的虛擬機執行
    
    steps:
      # 1. 把專案程式碼拉到虛擬機上
      - name: Checkout code
        uses: actions/checkout@v4
        
      # 2. 安裝 .NET SDK 環境
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      # 3. 還原依賴套件
      - name: Restore dependancies
        run: dotnet restore
        
      # 4. 編譯（確認沒語法錯誤）
      - name: Build
        run: dotnet build --no-restore --configuration Release
        
      # 5. 跑單元測試（只要有任一個 Assert 失敗，這一步就會爆掉中斷）
      - name: Run Unit Tests
        run: dotnet test --no-build --configuration Release --verbosity normal